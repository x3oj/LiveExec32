name: Build LiveExec32 CFHost fix
'on':
  push:
    branches:
    - cfhost-stream-fix
  workflow_dispatch: null
concurrency:
  group: liveexec32-cfhost-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - name: Restore extracted guest ramdisk
      id: ramdisk-cache
      uses: actions/cache/restore@v6
      with:
        path: tmp/ipsw/ramdisk.dmg
        key: lc32-ramdisk-v1-3564d16366b053503107288be6cb335b2283cf14838ab64a88017c17a2a6a1bc
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail

        brew install make boost ldid cmake

        theos="$RUNNER_TEMP/theos"
        theos_commit=5280bd038207e14f8bd76f5417aa2fe641c03228
        git init "$theos"
        git -C "$theos" remote add origin https://github.com/theos/theos.git
        git -C "$theos" fetch --depth 1 origin "$theos_commit"
        git -C "$theos" checkout --detach FETCH_HEAD
        git -C "$theos" submodule update --init --recursive --depth 1

        sdk_archive="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
        curl --fail --location --retry 3 --output "$sdk_archive" \
          https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $sdk_archive" \
          | shasum -a 256 -c -
        mkdir -p "$theos/sdks"
        tar -xJf "$sdk_archive" -C "$theos/sdks"
        test -f "$theos/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
        echo "THEOS=$theos" >> "$GITHUB_ENV"

        pzb_archive="$RUNNER_TEMP/pzb.zip"
        pzb_root="$RUNNER_TEMP/pzb"
        tools_dir="$RUNNER_TEMP/lc32-tools"
        curl --fail --location --retry 3 --output "$pzb_archive" \
          https://github.com/tihmstar/partialZipBrowser/releases/download/44/buildroot_macos-latest.zip
        echo "f72452e5c9c1248b8c4b4967a357b03addbe98d61ba8bad286ef0146dfdccdd2  $pzb_archive" \
          | shasum -a 256 -c -
        mkdir -p "$pzb_root" "$tools_dir"
        unzip -q "$pzb_archive" -d "$pzb_root"
        install -m 0755 \
          "$pzb_root/buildroot_macos-latest/usr/local/bin/pzb" \
          "$tools_dir/pzb"
        echo "$tools_dir" >> "$GITHUB_PATH"
    - name: Generate guest shims
      run: gmake -C GuestMakefile generate-shims
    - name: Build guest frameworks
      run: gmake -C GuestMakefile
    - name: Build ARM32 regression test and audit guest symbols
      shell: bash
      run: |
        set -euo pipefail
        gmake -C test cfnetwork-stream-cfhost cfnetwork-stream-cfhost-io urlconnection-main-queue TEST_OUTPUT_DIR="$RUNNER_TEMP/lc32-tests"
        bash test/public_guest_constants.sh
    - name: Check native CFHost stream behavior
      shell: bash
      run: |
        set -euo pipefail
        xcrun --sdk macosx clang -fno-objc-arc -Wall -Wextra -Werror \
          -Wno-deprecated-declarations -DLC32_CFHOST_STREAM_NATIVE_CHECK=1 \
          test/cfnetwork_stream_cfhost.m \
          -framework CFNetwork -framework CoreFoundation -framework Foundation \
          -o "$RUNNER_TEMP/cfhost-stream-native"
        "$RUNNER_TEMP/cfhost-stream-native"
        xcrun --sdk macosx clang -fno-objc-arc -Wall -Wextra -Werror \
          -Wno-deprecated-declarations test/cfnetwork_stream_cfhost_io.m \
          -framework CFNetwork -framework CoreFoundation -framework Foundation \
          -o "$RUNNER_TEMP/cfhost-stream-io-native"
        xcrun --sdk macosx clang -fno-objc-arc -fblocks -Wall -Wextra -Werror \
          -Wno-deprecated-declarations test/urlconnection_main_queue.m \
          -framework Foundation -framework CoreFoundation \
          -o "$RUNNER_TEMP/urlconnection-main-queue-native"
        xcrun --sdk macosx clang -target arm64-apple-ios15.0-macabi \
          -fno-objc-arc -fblocks -Wall -Wextra -Werror \
          -Wno-deprecated-declarations test/urlconnection_main_queue.m \
          -framework Foundation -framework CoreFoundation \
          -o "$RUNNER_TEMP/urlconnection-main-queue-catalyst"
    - name: Assemble guest root filesystem
      run: bash GuestMakefile/pack-ramdisk.sh
    - name: Save extracted guest ramdisk
      if: steps.ramdisk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: tmp/ipsw/ramdisk.dmg
        key: ${{ steps.ramdisk-cache.outputs.cache-primary-key }}
    - name: Build Catalyst runtime for ARM32 regression
      run: gmake LC32_BUILD_CATALYST=1
    - name: Run the ARM32 regression through LiveExec32
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/lc32-guest-home"
        export LC32_GUEST_HOME="$RUNNER_TEMP/lc32-guest-home"
        python3 - <<'PYTEST'
        import os, subprocess
        from pathlib import Path
        launcher = str(Path(".theos/obj/LiveExec32.app/LiveExec32").resolve())
        test = str(Path(os.environ["RUNNER_TEMP"]) / "lc32-tests/lc32-cfnetwork-stream-cfhost")
        subprocess.run([launcher, test], check=True, timeout=120)
        PYTEST
    - name: Test actual CFHost network transfers
      shell: bash
      run: |
        set -euo pipefail
        export LC32_GUEST_HOME="$RUNNER_TEMP/lc32-guest-home"
        python3 test/run_cfhost_stream_io.py \
          --native "$RUNNER_TEMP/cfhost-stream-io-native" \
          --launcher "$PWD/.theos/obj/LiveExec32.app/LiveExec32" \
          --guest "$RUNNER_TEMP/lc32-tests/lc32-cfnetwork-stream-cfhost-io" \
          --urlconnection-native "$RUNNER_TEMP/urlconnection-main-queue-native" \
          --urlconnection-catalyst "$RUNNER_TEMP/urlconnection-main-queue-catalyst" \
          --urlconnection-guest "$RUNNER_TEMP/lc32-tests/lc32-urlconnection-main-queue" \
          --probe-host hexagon.pw
    - name: Build iOS IPA
      run: gmake package LC32_BUILD_CATALYST=0
    - name: Verify the missing export inside the IPA
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYVERIFY'
        import hashlib, os, subprocess, zipfile
        from pathlib import Path
        packages = sorted(Path("packages").glob("*.ipa"))
        assert packages, "Build produced no IPA"
        checksums = []
        for package in packages:
            with zipfile.ZipFile(package) as archive:
                assert archive.testzip() is None, "Damaged IPA archive"
                names = [name for name in archive.namelist() if name.endswith(".app/RootFS/System/Library/Frameworks/CFNetwork.framework/CFNetwork")]
                assert len(names) == 1, "Guest CFNetwork missing or ambiguous in IPA"
                image = Path(os.environ["RUNNER_TEMP"]) / "packaged-CFNetwork"
                image.write_bytes(archive.read(names[0]))
            exports = subprocess.check_output(["xcrun", "nm", "-gjU", str(image)], text=True).splitlines()
            assert "_CFStreamCreatePairWithSocketToCFHost" in exports, "Missing export in packaged IPA"
            checksums.append(hashlib.sha256(package.read_bytes()).hexdigest() + "  " + package.name)
            print("Verified:", package)
        Path("packages/SHA256SUMS.txt").write_text("\n".join(checksums) + "\n")
        PYVERIFY
    - name: Upload patched IPA and checksum
      id: artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          packages/*.ipa
          packages/SHA256SUMS.txt
        if-no-files-found: error
        name: LiveExec32-CFHost-fixed
        retention-days: 14
